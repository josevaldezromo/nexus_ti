services:
  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Define APP_ORIGIN en .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mesa_ti}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mesa_ti}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en .env}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PORT: ${PORT:-3000}
      DB_POOL_MAX: 10
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mesa_ti}
      POSTGRES_USER: ${POSTGRES_USER:-mesa_ti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
